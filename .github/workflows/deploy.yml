name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: Verify patched Node.js 22
        run: |
          node -e 'const [major, minor, patch] = process.versions.node.split(".").map(Number); console.log(`Node.js v${process.versions.node}; minimum v22.23.4`); if (major !== 22 || minor < 23 || (minor === 23 && patch < 4)) process.exit(1)'
      - run: npm install
      - run: npm test
      - run: npm run data:validate
      - run: npm run data:sync
      - name: Deploy with Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
